<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="bg" cx="38%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#88f044"/>
      <stop offset="55%" stop-color="#4acc18"/>
      <stop offset="100%" stop-color="#1a6004"/>
    </radialGradient>
    <radialGradient id="es" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#88f044"/>
      <stop offset="70%" stop-color="#4acc18"/>
      <stop offset="100%" stop-color="#2a8808"/>
    </radialGradient>
  </defs>

  <!-- Feet -->
  <ellipse cx="10" cy="29.5" rx="5" ry="2.8" fill="#50cc20" stroke="#186004" stroke-width="0.9"/>
  <ellipse cx="22" cy="29.5" rx="5" ry="2.8" fill="#50cc20" stroke="#186004" stroke-width="0.9"/>

  <!-- Body -->
  <ellipse cx="16" cy="21" rx="11" ry="9.5" fill="url(#bg)" stroke="#186004" stroke-width="1.2"/>

  <!-- Belly -->
  <ellipse cx="17" cy="23" rx="6" ry="6" fill="rgba(200,255,160,0.40)"/>

  <!-- Left eye stalk -->
  <circle cx="10" cy="9" r="6" fill="url(#es)" stroke="#186004" stroke-width="1.2"/>
  <circle cx="10" cy="9" r="4.6" fill="white"/>
  <circle cx="11" cy="9.2" r="2.8" fill="#111"/>
  <circle cx="9.5" cy="7.5" r="1.1" fill="white"/>

  <!-- Right eye stalk -->
  <circle cx="22" cy="9" r="6" fill="url(#es)" stroke="#186004" stroke-width="1.2"/>
  <circle cx="22" cy="9" r="4.6" fill="white"/>
  <circle cx="23" cy="9.2" r="2.8" fill="#111"/>
  <circle cx="21.5" cy="7.5" r="1.1" fill="white"/>

  <!-- Nostrils -->
  <ellipse cx="14.5" cy="17" rx="1.2" ry="0.9" fill="#1a5800"/>
  <ellipse cx="17.5" cy="17" rx="1.2" ry="0.9" fill="#1a5800"/>

  <!-- Smile -->
  <path d="M11 22 Q16 27.5 21 22" fill="none" stroke="#0a4000" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M12.5 23 Q16 27 19.5 23 Q16 25 12.5 23Z" fill="#bb1a3a"/>

  <!-- Tongue -->
  <ellipse cx="16" cy="27.5" rx="2" ry="2.2" fill="#ff3d88" stroke="#cc1060" stroke-width="0.6"/>

  <!-- Cheek blush -->
  <ellipse cx="6.5" cy="20" rx="2.5" ry="1.8" fill="#ff7799" opacity="0.45"/>
  <ellipse cx="25.5" cy="20" rx="2.5" ry="1.8" fill="#ff7799" opacity="0.45"/>
</svg>
